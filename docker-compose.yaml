services:
  tangible-landscape:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BLENDER_VERSION: "${BLENDER_VERSION:-5.2.1}"
        GRASS_RELEASE: "${GRASS_RELEASE:-8.5.0}"
        PCL_RELEASE: "${PCL_RELEASE:-1.15.1}"
        ORBBEC_SDK_VERSION: "${ORBBEC_SDK_VERSION:-2.8.6}"
        NCORES: "${NCORES:-4}"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      GRASS_RELEASE: "${GRASS_RELEASE:-8.5.0}"
      PCL_RELEASE: "${PCL_RELEASE:-1.15.1}"
      ORBBEC_SDK_VERSION: "${ORBBEC_SDK_VERSION:-2.8.6}"
      NCORES: "${NCORES:-4}"
      DISPLAY: "${DISPLAY:-}"
    devices:
      - "/dev/bus/usb:/dev/bus/usb"
    device_cgroup_rules:
      - "c 189:* rmw"
    volumes:
      - "/tmp/.X11-unix:/tmp/.X11-unix:rw"
    ipc: host
    working_dir: /workspace
    stdin_open: true
    tty: true
    command: ["/bin/bash"]
